name: Deploy to GoDaddy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Instalar PHPMailer
        run: cd api && composer install --no-dev --optimize-autoloader

      - name: Generar config.php desde secrets
        run: |
          cat > api/config.php << 'PHPEOF'
          <?php
          return [
              'smtp_host'      => 'smtp.gmail.com',
              'smtp_port'      => 587,
              'smtp_secure'    => 'tls',
              'smtp_user'      => '${{ secrets.SMTP_USER }}',
              'smtp_pass'      => '${{ secrets.SMTP_PASS }}',
              'mail_to'        => 'info@sanaliayasociados.com',
              'mail_from'      => '${{ secrets.SMTP_USER }}',
              'mail_from_name' => 'Sitio Web — Sanalia & Asociados',
              'rate_limit_max' => 5,
              'rate_limit_ttl' => 3600,
              'rate_limit_dir' => __DIR__ . '/../storage/rate/',
              'log_file'       => __DIR__ . '/../storage/logs/contact.log',
          ];
          PHPEOF

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 107.180.118.0
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            CLAUDE.md
            storage/logs/**
            storage/rate/**
            node_modules/**
