name: Guardián del sitio (SEO/GEO en vivo)

# Revisa el sitio EN VIVO y falla si algo ya corregido se rompió.
# GitHub envía un correo cuando este workflow falla. Configuración: scripts/guardian/guardian.json
on:
  schedule:
    - cron: '0 12 * * *'   # diario 12:00 UTC = 8:00 a.m. en RD
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guardian
  cancel-in-progress: true

jobs:
  guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Esperar a que el deploy publique el push
        if: github.event_name == 'push'
        run: sleep 180

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar navegador
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium

      - name: Lo que ve Googlebot tras ejecutar JavaScript
        if: always()
        run: node scripts/guardian/guardian_render.mjs scripts/guardian/guardian.json

      # Después del render: este paso termina probando /.env y /.git, que hacen que el WAF del
      # hosting ponga la IP del runner en lista gris (ver guardian.py, sección 5).
      - name: Acceso, indexación, contenido y plataforma
        if: always()
        run: python3 scripts/guardian/guardian.py scripts/guardian/guardian.json
